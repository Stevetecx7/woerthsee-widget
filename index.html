<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wörthsee Temperatur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;900&display=swap');
  :root {
    --bg:#000; --blue:#00d4ff; --green:#00ff88;
    --white:#fff; --muted:#7ab8cc; --dim:#3a6070;
    --glow:0 0 30px rgba(0,212,255,0.8);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body{
    background:var(--bg);color:var(--white);font-family:'Rajdhani',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .widget{width:100%;text-align:center;transform-origin:center center;}
  .label{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,1.5vw,13px);letter-spacing:6px;
    color:var(--dim);text-transform:uppercase;margin-bottom:6px;font-weight:bold;
  }
  .title{
    font-size:clamp(32px,8vw,64px);font-weight:900;
    color:var(--white);letter-spacing:2px;margin-bottom:16px;
  }
  .temp-wrap{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin-bottom:4px;}
  .temp{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(72px,18vw,140px);font-weight:bold;
    color:var(--blue);text-shadow:var(--glow);line-height:1;letter-spacing:-4px;
  }
  .deg{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(28px,6vw,52px);color:var(--muted);
    margin-top:clamp(12px,2.5vw,22px);font-weight:bold;
  }
  .divider{
    width:clamp(80px,20vw,160px);height:2px;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);
    margin:12px auto;
  }
  .wave-wrap{
    width:clamp(160px,40vw,320px);
    height:clamp(16px,3vw,26px);
    margin:8px auto;
  }
  .wave-wrap canvas{display:block;width:100%!important;height:100%!important;}
  .time-line{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,1.4vw,12px);color:var(--dim);
    letter-spacing:4px;text-transform:uppercase;margin-bottom:16px;font-weight:bold;
  }
  .chart-wrap{width:100%;height:clamp(100px,18vw,150px);margin-bottom:6px;}
  canvas{display:block;width:100%!important;height:100%!important;}
  .chart-axis{display:flex;justify-content:space-between;padding:0 6px;margin-bottom:4px;}
  .chart-axis span{font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1.4vw,12px);color:var(--muted);font-weight:bold;letter-spacing:1px;}
  .chart-axis .heute{color:var(--green);font-weight:bold;}
  .status{font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1.2vw,11px);color:var(--dim);margin-top:6px;letter-spacing:1px;}
  .status.error{color:#e05050;}
</style>
</head>
<body>
<div class="widget">
  <div class="label">Wassertemperatur</div>
  <div class="title">Wörthsee</div>
  <div class="temp-wrap">
    <div class="temp" id="temp">--</div>
    <div class="deg">°C</div>
  </div>
  <div class="wave-wrap"><canvas id="wave"></canvas></div>
  <div class="time-line" id="zeit">--</div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <div class="chart-axis" id="chart-axis"></div>
  <div class="status" id="status">Lade Daten...</div>
</div>

<script>
// Direktes Scraping von GKD Bayern \u00fcber eine Kette \u00f6ffentlicher CORS-Proxies \u2014
// n\u00f6tig, weil GitHub Pages kein eigenes Backend hat (anders als die Pi-Version,
// die direkt vom Python-Proxy scraped). \u00d6ffentliche Gratis-Proxies fallen
// erfahrungsgem\u00e4\u00df immer wieder mal aus, deshalb mehrere mit Fallback probieren.
var GKD_URL = 'https://www.gkd.bayern.de/de/seen/wassertemperatur/isar/woerthsee-16651003/messwerte/tabelle';
var PROXIES = [
  function(u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
  function(u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function(u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); },
  function(u) { return 'https://thingproxy.freeboard.io/fetch/' + u; }
];
var MONATE_KURZ = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// Robuste Regex: begrenzte, aber nicht starre L\u00fccken zwischen Datum/Zeit/Wert,
// damit es sowohl bei "Datum+Zeit in einer Zelle" als auch bei getrennten
// Tabellenzellen (mit HTML-Tags dazwischen) funktioniert. Numerisch gegen
// mehrere Struktur-Varianten getestet.
function parseGkdHtml(html) {
  var re = /(\d{2}\.\d{2}\.\d{4})[\s\S]{0,20}?(\d{2}:\d{2})[\s\S]{0,80}?(\d+,\d+)/g;
  var rows = [];
  var m;
  while ((m = re.exec(html)) !== null) {
    rows.push({ date: m[1], time: m[2], value: parseFloat(m[3].replace(',', '.')) });
  }
  return rows;
}

function aggregateDailyMax(rows) {
  var byDate = {};
  var order = [];
  rows.forEach(function(r) {
    if (!(r.date in byDate)) { byDate[r.date] = -999; order.push(r.date); }
    if (r.value > byDate[r.date]) byDate[r.date] = r.value;
  });
  // GKD listet neueste zuerst -> f\u00fcr die Anzeige chronologisch (\u00e4ltestes zuerst) umkehren
  var chronological = order.slice().reverse();
  var last7 = chronological.slice(-7);
  return last7.map(function(d) {
    var parts = d.split('.');
    return { date: d, max: byDate[d], label: parts[0] + '.' + MONATE_KURZ[parseInt(parts[1], 10) - 1] };
  });
}

function drawChart(dailyData, currentVal, animT, updateAxis) {
  var canvas = document.getElementById('chart');
  var wrap   = canvas.parentElement;
  var W = wrap.clientWidth  || 440;
  var H = wrap.clientHeight || 130;
  if (canvas._w !== W || canvas._h !== H) {
    canvas.width  = Math.round(W * devicePixelRatio);
    canvas.height = Math.round(H * devicePixelRatio);
    canvas._w = W; canvas._h = H;
  }
  var ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  var vals = dailyData.map(function(d){ return d.max; });
  vals[vals.length - 1] = currentVal;

  var minV = Math.min.apply(null, vals) - 0.3;
  var maxV = Math.max.apply(null, vals) + 0.3;
  var pad  = { top: 22, right: 26, bottom: 6, left: 26 };
  var cW   = W - pad.left - pad.right;
  var cH   = H - pad.top  - pad.bottom;
  var n    = vals.length;

  var toX = function(i){ return pad.left + (i / (n - 1)) * cW; };
  var toY = function(v){ return pad.top + cH - ((v - minV) / (maxV - minV)) * cH; };
  var points = [];
  for (var pi = 0; pi < n; pi++) points.push({ x: toX(pi), y: toY(vals[pi]) });

  var grad = ctx.createLinearGradient(0, pad.top, 0, H);
  grad.addColorStop(0, 'rgba(0,212,255,0.30)');
  grad.addColorStop(1, 'rgba(0,212,255,0)');
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (var i = 1; i < n; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.lineTo(points[n-1].x, H); ctx.lineTo(points[0].x, H);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (var j = 1; j < n; j++) ctx.lineTo(points[j].x, points[j].y);
  ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 8; ctx.shadowColor = '#00d4ff';
  ctx.stroke(); ctx.shadowBlur = 0;

  // Flie\u00dfende Partikel entlang der Linie \u2014 mehrere, phasenversetzt, wandern
  // kontinuierlich von \u00e4ltestem zu heutigem Punkt (und wrappen dann zur\u00fcck).
  // ip = kontinuierliche "Segmentposition"; numerisch gegen Wrap-Verhalten
  // an den R\u00e4ndern (negativ, exakt n-1) getestet.
  var t = animT || 0;
  var nParticles = 3;
  for (var pk = 0; pk < nParticles; pk++) {
    var ipRaw = t * 0.6 + (pk / nParticles) * (n - 1);
    var span = n - 1;
    var ip = ((ipRaw % span) + span) % span;
    var i0 = Math.floor(ip);
    var frac = ip - i0;
    var i1 = Math.min(i0 + 1, n - 1);
    var qx = points[i0].x + (points[i1].x - points[i0].x) * frac;
    var qy = points[i0].y + (points[i1].y - points[i0].y) * frac;
    var alpha = 0.35 + 0.35 * Math.sin(frac * Math.PI); // sanftes Ein-/Ausblenden je Segment
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(qx, qy, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = '#00d4ff';
    ctx.shadowBlur = 6; ctx.shadowColor = '#00d4ff';
    ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  for (var p = 0; p < n; p++) {
    var px = points[p].x, py = points[p].y;
    var isToday = (p === n - 1);
    // Puls-Gl\u00fchen am heutigen Punkt \u2014 sanft atmend statt starr
    var pulse = isToday ? (0.5 + 0.5 * Math.sin(t * 2.2)) : 0;
    var rr = isToday ? (5 + pulse * 1.5) : 3;
    var glow = isToday ? (10 + pulse * 8) : 4;

    ctx.beginPath();
    ctx.arc(px, py, rr, 0, Math.PI * 2);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.strokeStyle = isToday ? '#00ff88' : '#00d4ff';
    ctx.lineWidth   = isToday ? 2.5 : 1.5;
    ctx.shadowBlur  = glow;
    ctx.shadowColor = isToday ? '#00ff88' : '#00d4ff';
    ctx.stroke(); ctx.shadowBlur = 0;

    ctx.fillStyle    = isToday ? '#00ff88' : '#7ab8cc';
    ctx.font         = 'bold ' + (isToday ? 12 : 10) + 'px Share Tech Mono,monospace';
    ctx.textAlign    = 'center'; ctx.textBaseline = 'bottom';
    if (isToday) { ctx.shadowBlur = 6; ctx.shadowColor = '#00ff88'; }
    ctx.fillText(vals[p].toFixed(1).replace('.',',') + '\u00b0', px, py - rr - 3);
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  if (updateAxis) {
    var ax = document.getElementById('chart-axis');
    ax.innerHTML = '';
    for (var d = 0; d < dailyData.length; d++) {
      var s = document.createElement('span');
      var isLast = (d === dailyData.length - 1);
      s.textContent = isLast ? 'HEUTE' : dailyData[d].label;
      if (isLast) s.className = 'heute';
      ax.appendChild(s);
    }
  }
}

// Dezente Wellenanimation \u2014 wasserthematisch, l\u00e4uft unabh\u00e4ngig vom Chart.
function drawWave(animT) {
  var canvas = document.getElementById('wave');
  if (!canvas) return;
  var wrap = canvas.parentElement;
  var W = wrap.clientWidth  || 240;
  var H = wrap.clientHeight || 20;
  if (canvas._w !== W || canvas._h !== H) {
    canvas.width  = Math.round(W * devicePixelRatio);
    canvas.height = Math.round(H * devicePixelRatio);
    canvas._w = W; canvas._h = H;
  }
  var ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  var midY = H / 2;
  var amp = H * 0.28;
  ctx.beginPath();
  for (var x = 0; x <= W; x += 4) {
    var y = midY + amp * Math.sin((x / W) * Math.PI * 3 + animT * 1.5);
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 6; ctx.shadowColor = '#00d4ff';
  ctx.globalAlpha = 0.55;
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();
}

// Proxy-Kette mit Fallback: erst Proxy 1 versuchen, bei Fehler/Timeout naechsten,
// bis einer funktioniert oder alle durch sind.
function fetchViaProxies(index, onSuccess, onAllFailed) {
  if (index >= PROXIES.length) { onAllFailed(); return; }
  var url = PROXIES[index](GKD_URL);
  var xhr = new XMLHttpRequest();
  xhr.timeout = 8000;
  xhr.open('GET', url, true);
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText && xhr.responseText.length > 200) {
      onSuccess(xhr.responseText);
    } else {
      fetchViaProxies(index + 1, onSuccess, onAllFailed);
    }
  };
  xhr.onerror = xhr.ontimeout = function() {
    fetchViaProxies(index + 1, onSuccess, onAllFailed);
  };
  xhr.send();
}

function fetchTemp() {
  var statusEl = document.getElementById('status');
  var tempEl   = document.getElementById('temp');
  var zeitEl   = document.getElementById('zeit');

  fetchViaProxies(0, function(html) {
    try {
      var rows = parseGkdHtml(html);
      if (rows.length === 0) throw new Error('Keine Messwerte gefunden');
      var current = rows[0]; // GKD listet den neuesten Wert zuerst
      var daily = aggregateDailyMax(rows);

      tempEl.textContent = current.value.toFixed(1).replace('.', ',');
      zeitEl.textContent = 'Messung ' + current.date + ' \u00b7 ' + current.time + ' Uhr';
      lastDaily = daily; lastCurrentVal = current.value;
      drawChart(daily, current.value, animT, true);

      statusEl.className = 'status';
      var now = new Date();
      statusEl.textContent = 'GKD Bayern \u00b7 ' +
        now.getHours().toString().padStart(2,'0') + ':' +
        now.getMinutes().toString().padStart(2,'0') + ' Uhr';
    } catch (e) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Fehler \u00b7 Retry in 15min';
    }
    fitToScreen();
  }, function() {
    statusEl.className = 'status error';
    statusEl.textContent = 'Fehler \u00b7 Retry in 15min';
    fitToScreen();
  });
}

// ── Fit-to-Screen ────────────────────────────────────────────────
function fitToScreen() {
  var widget = document.querySelector('.widget');
  if (!widget) return;
  widget.style.transform = 'none';
  var natW = widget.scrollWidth;
  var natH = widget.scrollHeight;
  if (!natW || !natH) return;
  var pad = 16;
  var availW = window.innerWidth  - pad;
  var availH = window.innerHeight - pad;
  var scale = Math.min(availW / natW, availH / natH, 1.4);
  if (!isFinite(scale) || scale <= 0) scale = 1;
  widget.style.transform = 'scale(' + scale.toFixed(4) + ')';
}

// ── Animationsschleife ───────────────────────────────────────────
// Zeitbasiert (nicht frame-basiert) \u2014 l\u00e4uft auf jedem Ger\u00e4t gleich schnell,
// unabh\u00e4ngig von der tats\u00e4chlichen Framerate.
var lastDaily = null, lastCurrentVal = null;
var animT = 0;
var lastAnimTs = null;

function animateLoop() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  if (lastAnimTs === null) lastAnimTs = now;
  var dt = Math.min((now - lastAnimTs) / 1000, 0.1); // Deckel gegen Sprung nach Tab-Pause
  lastAnimTs = now;
  animT += dt;

  drawWave(animT);
  if (lastDaily) drawChart(lastDaily, lastCurrentVal, animT, false);

  requestAnimationFrame(animateLoop);
}
requestAnimationFrame(animateLoop);

fetchTemp();
setInterval(fetchTemp, 15 * 60 * 1000);

var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(function(){ fitToScreen(); }, 300);
});
window.addEventListener('load', fitToScreen);
setTimeout(fitToScreen, 500);
setInterval(fitToScreen, 15000);
</script>
</body>
</html>
