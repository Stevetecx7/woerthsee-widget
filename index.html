<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wörthsee Temperatur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;900&display=swap');
  :root {
    --bg:#000; --blue:#00d4ff; --green:#00ff88; --white:#fff;
    --muted:#7ab8cc; --dim:#3a6070;
    --glow:0 0 30px rgba(0,212,255,0.8);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--white);
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;display:flex;align-items:center;
    justify-content:center;padding:20px;
  }
  .widget{width:100%;max-width:600px;text-align:center;}
  .label{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,1.5vw,13px);letter-spacing:6px;
    color:var(--dim);text-transform:uppercase;margin-bottom:6px;
    font-weight:bold;
  }
  .title{
    font-size:clamp(32px,8vw,64px);font-weight:900;
    color:var(--white);letter-spacing:2px;margin-bottom:16px;
  }
  .temp-wrap{
    display:flex;align-items:flex-start;justify-content:center;
    gap:4px;margin-bottom:4px;
  }
  .temp{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(72px,20vw,160px);font-weight:bold;
    color:var(--blue);text-shadow:var(--glow);
    line-height:1;letter-spacing:-4px;
  }
  .deg{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(28px,7vw,56px);color:var(--muted);
    margin-top:clamp(12px,3vw,24px);font-weight:bold;
  }
  .divider{
    width:clamp(80px,20vw,160px);height:2px;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);
    margin:12px auto;
  }
  .time-line{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,1.5vw,12px);color:var(--dim);
    letter-spacing:4px;text-transform:uppercase;
    margin-bottom:20px;font-weight:bold;
  }
  /* Chart */
  .chart-wrap{width:100%;height:clamp(80px,15vw,120px);margin-bottom:6px;}
  canvas{display:block;width:100%!important;height:100%!important;}
  .chart-axis{
    display:flex;justify-content:space-between;
    padding:0 8px;margin-bottom:4px;
  }
  .chart-axis span{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(7px,1.2vw,10px);color:var(--dim);font-weight:bold;
  }
  .status{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(8px,1.3vw,11px);color:var(--dim);
    margin-top:8px;letter-spacing:2px;
  }
  .status.error{color:#e05050;}
</style>
</head>
<body>
<div class="widget">
  <div class="label">Wassertemperatur</div>
  <div class="title">Wörthsee</div>
  <div class="temp-wrap">
    <div class="temp" id="temp">--</div>
    <div class="deg">°C</div>
  </div>
  <div class="divider"></div>
  <div class="time-line" id="timeLine">Lade Daten...</div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <div class="chart-axis" id="chartAxis"></div>
  <div class="status" id="status"></div>
</div>

<script>
var GKD_URL = 'https://www.gkd.bayern.de/de/seen/wassertemperatur/isar/woerthsee-16651003/messwerte/tabelle';

// CORS-Proxy Kette — wird der Reihe nach versucht
var PROXIES = [
  function(u) { return 'https://corsproxy.io/?' + encodeURIComponent(u); },
  function(u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function(u) { return 'https://thingproxy.freeboard.io/fetch/' + u; },
  function(u) { return 'https://api.codetabs.com/v1/proxy?quest=' + u; }
];

var dailyData = [];
var proxyIndex = 0;

function tryFetch(idx) {
  if (idx >= PROXIES.length) {
    setError('Alle Proxies fehlgeschlagen');
    return;
  }
  var url = PROXIES[idx](GKD_URL);
  var xhr = new XMLHttpRequest();
  xhr.timeout = 10000;
  xhr.open('GET', url, true);
  xhr.onload = function() {
    if (xhr.status === 200 && xhr.responseText.length > 500) {
      parseHtml(xhr.responseText, idx);
    } else {
      tryFetch(idx + 1);
    }
  };
  xhr.onerror = xhr.ontimeout = function() { tryFetch(idx + 1); };
  xhr.send();
}

function parseHtml(html, proxyIdx) {
  // Regex: Datum Zeit ... Temperatur
  var rows = [];
  var rx = /(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})[^<]*<[^>]*>[^<]*(\d+,\d+)/g;
  var m;
  while ((m = rx.exec(html)) !== null) {
    rows.push([m[1], m[2], m[3]]);
  }

  // Fallback: einfacherer Regex
  if (rows.length === 0) {
    var rx2 = /(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})[\s\S]{0,50}?(\d+,\d+)/g;
    while ((m = rx2.exec(html)) !== null) {
      rows.push([m[1], m[2], m[3]]);
      if (rows.length > 200) break;
    }
  }

  if (rows.length === 0) {
    // Letzter Versuch — nächster Proxy
    tryFetch(proxyIdx + 1);
    return;
  }

  // Tagesmaximum berechnen
  var days = {};
  var order = [];
  for (var i = 0; i < rows.length; i++) {
    var d = rows[i][0];
    var val = parseFloat(rows[i][2].replace(',', '.'));
    if (!(d in days)) { days[d] = val; order.push(d); }
    else if (val > days[d]) days[d] = val;
  }

  var latestVal = parseFloat(rows[0][2].replace(',', '.'));
  var latestTime = rows[0][0] + ' ' + rows[0][1] + ' Uhr';

  // Chart-Daten: letzte 7 Tage, heute = aktueller Wert
  var chartDays = order.slice(0, 7).reverse();
  dailyData = [];
  for (var j = 0; j < chartDays.length; j++) {
    var k = chartDays[j];
    var isToday = (j === chartDays.length - 1);
    dailyData.push({
      label: k.substring(0, 5),
      val:   isToday ? latestVal : days[k]
    });
  }

  // Anzeige
  document.getElementById('temp').textContent = latestVal.toFixed(1).replace('.', ',');
  document.getElementById('timeLine').textContent =
    'Messung ' + latestTime.replace(' ', ' · ').toLowerCase().replace('uhr', 'Uhr');
  document.getElementById('status').className = 'status';
  document.getElementById('status').textContent =
    'GKD Bayern · ' + new Date().toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + ' Uhr';

  drawChart();
  buildAxis();
}

function drawChart() {
  var canvas = document.getElementById('chart');
  var wrap   = canvas.parentElement;
  var W = wrap.clientWidth || 500;
  var H = wrap.clientHeight || 100;
  canvas.width  = Math.round(W * devicePixelRatio);
  canvas.height = Math.round(H * devicePixelRatio);
  var ctx = canvas.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);

  if (dailyData.length < 2) return;

  var vals = dailyData.map(function(d){ return d.val; });
  var minV = Math.min.apply(null, vals) - 0.5;
  var maxV = Math.max.apply(null, vals) + 0.5;

  var pad = {top:10, right:12, bottom:10, left:12};
  var cW = W - pad.left - pad.right;
  var cH = H - pad.top  - pad.bottom;
  var toX = function(i){ return pad.left + (i / (dailyData.length-1)) * cW; };
  var toY = function(v){ return pad.top + cH - ((v - minV) / (maxV - minV)) * cH; };

  // Gradient fill
  var grad = ctx.createLinearGradient(0, pad.top, 0, H);
  grad.addColorStop(0,   'rgba(0,212,255,0.35)');
  grad.addColorStop(1,   'rgba(0,212,255,0)');
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(dailyData[0].val));
  for (var i = 1; i < dailyData.length; i++) ctx.lineTo(toX(i), toY(dailyData[i].val));
  ctx.lineTo(toX(dailyData.length-1), H);
  ctx.lineTo(toX(0), H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Linie
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(dailyData[0].val));
  for (var j = 1; j < dailyData.length; j++) ctx.lineTo(toX(j), toY(dailyData[j].val));
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 8; ctx.shadowColor = '#00d4ff';
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Datenpunkte
  for (var p = 0; p < dailyData.length; p++) {
    var isLast = (p === dailyData.length - 1);
    ctx.beginPath();
    ctx.arc(toX(p), toY(dailyData[p].val), isLast ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.strokeStyle = isLast ? '#00ff88' : '#00d4ff';
    ctx.lineWidth = isLast ? 2.5 : 1.5;
    ctx.shadowBlur = isLast ? 10 : 4;
    ctx.shadowColor = isLast ? '#00ff88' : '#00d4ff';
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Temperatur-Label über Punkt
    ctx.fillStyle = isLast ? '#00ff88' : '#7ab8cc';
    ctx.font = 'bold ' + (isLast ? 11 : 9) + 'px Share Tech Mono, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(dailyData[p].val.toFixed(1).replace('.',',') + '°', toX(p), toY(dailyData[p].val) - 4);
  }
}

function buildAxis() {
  var ax = document.getElementById('chartAxis');
  ax.innerHTML = '';
  for (var i = 0; i < dailyData.length; i++) {
    var s = document.createElement('span');
    var parts = dailyData[i].label.split('.');
    s.textContent = (i === dailyData.length - 1) ? 'HEUTE' : parts[0] + '.' + parts[1] + '.';
    s.style.color = (i === dailyData.length - 1) ? '#00ff88' : '';
    ax.appendChild(s);
  }
}

function setError(msg) {
  var el = document.getElementById('status');
  el.className = 'status error';
  el.textContent = 'Fehler · ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) + ' · Retry in 15min';
  document.getElementById('timeLine').textContent = msg;
}

// Starten
tryFetch(0);
// Alle 15 Minuten neu laden
setInterval(function(){ proxyIndex = 0; tryFetch(0); }, 15 * 60 * 1000);

window.addEventListener('resize', function() {
  if (dailyData.length) { drawChart(); }
});
</script>
</body>
</html>
