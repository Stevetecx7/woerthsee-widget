<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wörthsee Temperatur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;600&display=swap');

  :root {
    --bg: #080c10;
    --blue: #00b4d8;
    --blue-dim: #0077a8;
    --white: #e8f4f8;
    --muted: #3a5060;
    --glow: 0 0 18px rgba(0,180,216,0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
  }

  .widget {
    position: relative;
    padding: 36px 48px 32px;
    text-align: center;
    min-width: 280px;
  }

  /* Corner brackets */
  .widget::before, .widget::after,
  .inner::before, .inner::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: var(--blue);
    border-style: solid;
  }
  .widget::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .widget::after  { top: 0; right: 0; border-width: 2px 2px 0 0; }
  .inner::before  { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
  .inner::after   { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

  .inner { position: relative; }

  .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--blue-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .location {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--white);
    margin-bottom: 18px;
    line-height: 1;
  }

  .temp-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
  }

  .temp-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 72px;
    color: var(--blue);
    text-shadow: var(--glow);
    line-height: 1;
    letter-spacing: -2px;
    transition: opacity 0.4s;
  }

  .temp-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    color: var(--blue-dim);
    align-self: flex-start;
    margin-top: 10px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    margin: 16px auto;
  }

  .meta {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 8px;
    min-height: 14px;
    letter-spacing: 1px;
  }

  .status.error { color: #e05050; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .loading { animation: pulse 1.2s ease-in-out infinite; color: var(--blue-dim) !important; }
</style>
</head>
<body>
<div class="widget">
  <div class="inner">
    <div class="label">Wassertemperatur</div>
    <div class="location">Wörthsee</div>
    <div class="temp-row">
      <div class="temp-value" id="temp">--</div>
      <div class="temp-unit">°C</div>
    </div>
    <div class="divider"></div>
    <div class="meta" id="zeit">--</div>
    <div class="status loading" id="status">Lade Daten...</div>
  </div>
</div>

<script>
const TARGET = 'https://www.gkd.bayern.de/de/seen/wassertemperatur/isar/woerthsee-16651003/messwerte/tabelle';

// Mehrere Proxies als Fallback-Kette
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function tryProxy(proxyFn, url) {
  const res = await fetch(proxyFn(url), { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  try {
    const json = JSON.parse(text);
    return json.contents || json;
  } catch {
    return text;
  }
}

function parseTemp(html) {
  const matches = [...html.matchAll(/<td[^>]*>\s*(\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2})\s*<\/td>\s*<td[^>]*>\s*([\d,]+)\s*<\/td>/g)];
  if (matches.length > 0) return { zeit: matches[0][1].trim(), wert: matches[0][2].trim() };
  const simple = html.match(/(\d{2}\.\d{2}\.\d{4} \d{2}:\d{2})[\s\S]{0,50}?([\d]+,[\d]+)/);
  if (simple) return { zeit: simple[1], wert: simple[2] };
  return null;
}

async function fetchTemp() {
  const statusEl = document.getElementById('status');
  const tempEl   = document.getElementById('temp');
  const zeitEl   = document.getElementById('zeit');

  statusEl.className = 'status loading';
  statusEl.textContent = 'Lade Daten...';

  let lastError = null;

  for (const proxyFn of PROXIES) {
    try {
      const html = await tryProxy(proxyFn, TARGET);
      const result = parseTemp(html);
      if (result) {
        tempEl.textContent = result.wert;
        zeitEl.textContent = 'MESSUNG ' + result.zeit + ' UHR';
        statusEl.className = 'status';
        statusEl.textContent = 'GKD Bayern · ' + new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + ' Uhr';
        return;
      } else {
        throw new Error('Kein Messwert im HTML');
      }
    } catch (err) {
      lastError = err;
    }
  }

  statusEl.className = 'status error';
  statusEl.textContent = 'Fehler · ' + new Date().toLocaleTimeString('de-DE') + ' · Retry in 10min';
  console.error('Alle Proxies fehlgeschlagen:', lastError);
}

fetchTemp();
setInterval(fetchTemp, 10 * 60 * 1000);
</script>
</body>
</html>
